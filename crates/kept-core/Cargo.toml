[package]
name = "kept-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kept agent core: storage, extraction, scheduling, notifications and connectors (UI-agnostic)."

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json", "backup"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
once_cell = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
tracing = "0.1"
mail-parser = "0.9"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
