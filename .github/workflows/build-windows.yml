# Builds and tests Kept on a real Windows machine and produces the installers.
# Push to GitHub, then: Actions → "Build Windows installer" → Run workflow.
# Download the result from the run's "Artifacts" section (Kept_*_x64-setup.exe and .msi).
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Leave these secrets UNSET for the public installer: users bring their own app
      # (guided in-app) or import their IT team's settings file. Set them only for a private build.
      KEPT_GOOGLE_CLIENT_ID: ${{ secrets.KEPT_GOOGLE_CLIENT_ID }}
      KEPT_GOOGLE_CLIENT_SECRET: ${{ secrets.KEPT_GOOGLE_CLIENT_SECRET }}
      KEPT_MS_CLIENT_ID: ${{ secrets.KEPT_MS_CLIENT_ID }}
      KEPT_SLACK_CLIENT_ID: ${{ secrets.KEPT_SLACK_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run tests (Rust core, on Windows)
        run: cargo test -p kept-core

      - name: Build installers
        run: npm run tauri build -- --bundles nsis,msi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: kept-windows-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Attach to GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
